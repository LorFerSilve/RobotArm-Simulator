name: C++ build and motion regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core and tests
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DROBOTARM_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run the complete regression suite
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with GUI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DROBOTARM_BUILD_GUI=ON
      - name: Build with MSVC and raylib
        run: cmake --build build --config Release --parallel 2
      - name: Run the complete regression suite
        run: ctest --test-dir build -C Release --output-on-failure
